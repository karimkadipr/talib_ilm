<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The app's eight-point star (LogoMark) on a dark tile, with heavier strokes so it reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#0b0f0e"/>
  <g fill="#62d8a6" fill-opacity="0.18" stroke="#62d8a6" stroke-width="2.2" stroke-linejoin="round">
    <rect x="8.5" y="8.5" width="15" height="15" rx="1.5"/>
    <rect x="8.5" y="8.5" width="15" height="15" rx="1.5" transform="rotate(45 16 16)"/>
  </g>
  <circle cx="16" cy="16" r="2.8" fill="#eec469"/>
</svg>
